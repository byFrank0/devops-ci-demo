name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Этап 1: Статический анализ кода (Линтинг)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 linter
        run: |
          flake8 .

  # Этап 2: Тестирование и замер покрытия (зависит от прохождения lint)
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=src --cov-report=term --cov-report=html

      - name: Upload Coverage HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # Этап 3: Сборка релизного архива (запускается только при успешных тестах)
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package application
        run: |
          mkdir -p dist
          tar -czf dist/app-release.tar.gz src/ requirements.txt

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: dist/app-release.tar.gz
          retention-days: 14